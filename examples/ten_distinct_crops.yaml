seed: 20261009

# Ten deterministic but morphologically distinct rosettes in two rows. Placement jitter uses
# the world's placement stream; leaf morphology uses an independent stream derived from seed
# and crop ID.
generators:
  - gentype: grid
    origin: [0.0, 0.0]
    rows: 2
    columns: 5
    spacing: [2.5, 2.5]
    jitter: 0.0
    crop:
      gentype: generic
      scale: {mean: 0.55, min: 0.35, max: 0.75}
      leaf_num: {mean: 5, min: 3, max: 8, stddev: 1.5}
      leaf_length: {mean: 1.0, min: 0.75, max: 1.3}
      leaf_width: {mean: 0.32, min: 0.18, max: 0.5}
      leaf_offset: {mean: 0.0, min: -0.08, max: 0.12}
      leaf_orientation: {mean: 0.0, min: -0.45, max: 0.45}
